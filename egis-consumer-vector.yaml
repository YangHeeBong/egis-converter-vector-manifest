apiVersion: apps/v1
kind: Deployment
metadata:
  name: egis-consumer-vector
  namespace: egis-cloud
spec:
  selector:
    matchLabels:
      app: egis-consumer-vector
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      annotations:
        controller.kubernetes.io/pod-deletion-cost: "0"
      labels:
        app: egis-consumer-vector
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kakaoi.io/kke-nodepool
                    operator: In
                    values:
                      - egis-converter-pool
      serviceAccountName: egis-consumer-vector
      terminationGracePeriodSeconds: 43200
      containers:
        - name: egis-consumer-vector-container
          image: digitaltwin-container.kr-central-2.kcr.dev/egis-dev-convert/egis-converter-vector:20261005-f80b7cb
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: TASKMESSAGE_POD_COST_SCRIPT
              value: /etc/taskmessage/pod-deletion-cost.sh
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - test -f /tmp/taskmessage.ready
            initialDelaySeconds: 1
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          volumeMounts:
            - name: convert-user-data
              mountPath: /data/DT_DATA
            - name: taskmessage-pod-control
              mountPath: /etc/taskmessage
              readOnly: true
          securityContext:
            privileged: true
            readOnlyRootFilesystem: false
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
      volumes:
        - name: convert-user-data
          persistentVolumeClaim:
            claimName: egis-convert-userdata-pvc
        - name: taskmessage-pod-control
          configMap:
            name: egis-consumer-vector-pod-control
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: egis-consumer-vector-hpa
  namespace: egis-cloud
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: egis-consumer-vector
  minReplicas: 1
  maxReplicas: 3
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 180
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: egis-consumer-vector
  namespace: egis-cloud
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: egis-consumer-vector-pod-control
  namespace: egis-cloud
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: egis-consumer-vector-pod-control
  namespace: egis-cloud
subjects:
  - kind: ServiceAccount
    name: egis-consumer-vector
    namespace: egis-cloud
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: egis-consumer-vector-pod-control
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: egis-consumer-vector-pod-control
  namespace: egis-cloud
data:
  pod-deletion-cost.sh: |
    #!/bin/sh
    # Update only this Pod's deletion preference. This does not prevent deletion.
    set -eu

    fail() {
        printf '%s\n' "Pod deletion cost: $*" >&2
        exit 1
    }

    case "${1:-}" in
        0|1000) cost=$1 ;;
        *) fail "expected cost 0 or 1000" ;;
    esac
    case "${POD_NAME:-}" in
        ''|*[!a-z0-9.-]*) fail "invalid POD_NAME" ;;
    esac
    case "${POD_NAMESPACE:-}" in
        ''|*[!a-z0-9-]*) fail "invalid POD_NAMESPACE" ;;
    esac
    case "${POD_UID:-}" in
        ''|*[!a-fA-F0-9-]*) fail "invalid POD_UID" ;;
    esac

    credentials=${TASKMESSAGE_SERVICEACCOUNT_DIR:-/var/run/secrets/kubernetes.io/serviceaccount}
    [ -r "$credentials/token" ] || fail "ServiceAccount token is unavailable"
    [ -r "$credentials/ca.crt" ] || fail "ServiceAccount CA is unavailable"
    token=$(cat "$credentials/token") || fail "cannot read ServiceAccount token"
    case "$token" in
        ''|*[!a-zA-Z0-9._-]*) fail "invalid ServiceAccount token" ;;
    esac

    payload=$(printf '[{"op":"test","path":"/metadata/uid","value":"%s"},{"op":"add","path":"/metadata/annotations/controller.kubernetes.io~1pod-deletion-cost","value":"%s"}]' "$POD_UID" "$cost")
    url="https://kubernetes.default.svc/api/v1/namespaces/$POD_NAMESPACE/pods/$POD_NAME"

    # Read the token on every transition because projected tokens rotate.
    # Feed the Authorization header on stdin; never expose the token in argv/logs.
    if status=$(printf 'Authorization: Bearer %s\n' "$token" |
        curl -q --silent --show-error --proto '=https' --noproxy '*' \
            --connect-timeout 2 --max-time 5 \
            --request PATCH --cacert "$credentials/ca.crt" \
            --header @- --header 'Content-Type: application/json-patch+json' \
            --data-binary "$payload" --output /dev/null --write-out '%{http_code}' \
            "$url"); then
        case "$status" in
            2??) exit 0 ;;
            *) fail "API returned HTTP $status" ;;
        esac
    else
        fail "API request failed"
    fi
